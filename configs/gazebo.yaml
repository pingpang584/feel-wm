# Feel-WM on a Gazebo Husky corpus (per-sequence loader: train with --sim). Variants:
#   feelwm       full model                                          (default)
#   noprop       without proprioceptive input
#   visual_only  no proprio input, no proprio / traversability heads
# Train: python tools/train.py configs/gazebo.yaml --sim --variant feelwm

default_variant: feelwm

model:
  context_len: 3
  rollout_horizon: 8
  n_patch: 256
  d_vis: 768
  d_prop: 128
  d_action: 4
  d_raw: 13
  n_layers: 6
  n_heads: 8
  ffn_mult: 4
  dropout: 0.1
  use_proprio_input: true
  use_proprio_feature_head: true
  use_traversability_head: true
  proprio_feature_dim: 4
  traversability_input_mode: parallel
  action_conditioning: film
  gradient_checkpointing: true
data:
  seq_root: ${DATA_ROOT}/negs-ugv/sim_husky_v3/sequences/all
  feat_version: sim_dinov2reg_v1
  norm_stats_path: data/norm_stats/sim_husky_v3.json
  heldout_substrings: [n1990, park_jt_07, lake_run_12, lake_cov_16, forest_run_7, lake_col_1, park_col_1,
    forest_col_1]
  context_len: 3
  rollout_horizon: 8
  active_proprio_channels: [roughness, slip_ratio, angular_instability, slope_power]
  include_dt: true
  train_strides: [1, 2, 5, 10]
  stride_sampling: random
  val_stride: 1
  proprio_horizon_s: 4.0
loss:
  lambda_prop: 0.5
  lambda_trav: 1.0
  lambda_cos: 0.1
  channel_names: [roughness, slip_ratio, angular_instability, slope_power]
  proprio_weights: [1.0, 1.0, 1.0, 1.0]
curriculum:
  enabled: false
scheduled_sampling:
  enabled: true
  start_epoch: 5
  end_epoch: 15
  p_start: 1.0
  p_end: 0.5
  mask_granularity: sample
training:
  epochs: 20
  batch_size: 64
  lr: 0.0006
  lr_schedule: cosine
  lr_warmup_epochs: 1
  weight_decay: 0.05
  grad_clip: 1.0
  num_workers: 8
  eval_num_workers: 4
  dataloader_timeout_s: 1800
  device: cuda
  amp: true
  amp_dtype: bfloat16
  seed: 0
  save_epoch_checkpoints: true
  checkpoint_path: ${OUTPUT_ROOT}/gazebo/${VARIANT}/checkpoint.pt
  metrics_path: ${OUTPUT_ROOT}/gazebo/${VARIANT}/metrics.jsonl
  per_sequence_dir: ${OUTPUT_ROOT}/gazebo/${VARIANT}/per_sequence

variants:
  feelwm: null
  noprop:
    model:
      use_proprio_input: false
    training:
      dist_timeout_minutes: 90
      dataloader_timeout_s: 3600
  visual_only:
    model:
      use_proprio_input: false
      use_proprio_feature_head: false
      use_traversability_head: false
    loss:
      lambda_prop: 0.0
      lambda_trav: 0.0
    training:
      dist_timeout_minutes: 90
      dataloader_timeout_s: 3600
